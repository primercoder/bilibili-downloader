<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bili 下载器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">bili</span>
    <h1>Bili 下载器</h1>
    <span id="statusDot" title="本地助手"></span>
  </header>

  <main>
    <section id="loading" class="center">正在读取…</section>

    <section id="error" class="hidden">
      <div id="errorBox" class="error-text"></div>
      <button id="retry" class="secondary full" type="button">重试</button>
    </section>

    <section id="form" class="hidden">
      <div id="title" class="title"></div>
      <div id="meta" class="meta"></div>

      <label id="pageLabel" class="hidden"><span id="pageLabelText">分 P</span>
        <select id="pageSelect"></select>
      </label>

      <label>清晰度
        <select id="quality"></select>
      </label>

      <label>音频
        <select id="audio"></select>
      </label>

      <label>保存到
        <div class="path-row">
          <input id="directory" type="text" spellcheck="false">
          <button id="browse" class="secondary" type="button">选择</button>
        </div>
      </label>

      <label class="switch-row">
        <span>保留中间文件</span>
        <input id="keep" type="checkbox" role="switch">
      </label>

      <button id="download" class="primary" type="button">下载 MP4</button>
    </section>

    <section id="progressSection" class="hidden">
      <div class="progress-head">
        <span id="stage">准备中</span>
        <span id="percent">0%</span>
      </div>
      <div class="progress-track"><div id="bar"></div></div>
      <div class="stats">
        <span id="doneSize">—</span>
        <span id="speed">—</span>
        <span id="etaWrap" class="hidden">剩余 <b id="eta">—</b></span>
      </div>
      <div id="result" class="result hidden"></div>
      <button id="openFolder" class="primary full hidden" type="button">打开所在文件夹</button>
      <button id="cancel" class="secondary full" type="button">取消</button>
      <button id="again" class="secondary full hidden" type="button">继续下载</button>
    </section>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
